# PR마다 Claude가 1차 리뷰를 남긴다. 사람 리뷰는 그 뒤에 도메인 관점으로 한다.
#
# 인증은 API 키가 아니라 Claude 구독 토큰(CLAUDE_CODE_OAUTH_TOKEN)이다. `claude setup-token`으로 만든다.
# 토큰을 만든 사람의 구독 사용량을 같이 쓰므로, 실행 횟수를 줄이는 조건을 아래에 둔다.
# - draft PR은 건너뛰고 ready_for_review로 바뀔 때 돈다.
# - 같은 PR에 새로 push하면 아직 끝나지 않은 리뷰를 취소한다.
# - 공개 레포라 누구나 댓글을 달 수 있어서, @claude 재리뷰는 레포 주인 댓글만 받는다.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

# 취소는 아래 if보다 먼저 적용된다.
# 댓글 이벤트가 같은 그룹에 들어오면 Vercel 봇이나 Claude 자신의 댓글이 진행 중인 리뷰를 취소하므로, PR 이벤트끼리만 한 그룹으로 묶고 댓글 이벤트는 실행마다 따로 둔다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('claude-review-{0}', github.event.pull_request.number) || format('claude-review-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: |
            --model sonnet --max-turns 20 --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            이 PR을 리뷰한다. CLAUDE.md와 .claude/는 gitignore 대상이라 체크아웃에 없다. 기준은 아래가 전부다.

            스택: Next.js App Router, TypeScript strict, TanStack Query v5, React Hook Form + Zod,
            shadcn/ui(Base UI) + Tailwind CSS v4, Supabase(Auth, Postgres, Storage, Realtime). 전역 상태 라이브러리는 없다.

            심각도
            - CRITICAL: 보안 취약점, 데이터 유실, 프로덕션 장애
            - HIGH: 버그, 심한 성능 저하, 아키텍처 위반
            - MEDIUM: 유지보수성 저하
            - LOW: 개선 제안

            체크리스트
            - 보안: 보호된 페이지와 API에서 Supabase 세션 확인, `dangerouslySetInnerHTML`, `NEXT_PUBLIC_`에 민감 정보,
              사용자 입력의 Zod 검증, 파일 업로드 타입과 크기 제한, 하드코딩된 키
            - 구조: services/<도메인>의 4파일 패턴(types, services, queries, hook), 컴포넌트 안 직접 API 호출,
              동시에 실행되지 않는 모드의 코드가 한 컴포넌트에 섞임, 이름이 같은데 동작이 다른 함수
            - 크기: 함수 50줄, 파일 600줄, props 8개를 넘김. `any`, `@ts-ignore`, `console.log`
            - 성능: `useEffect` 의존성, 불필요한 리렌더링, TanStack Query `staleTime` 누락, `next/image` 미사용
            - UI: shadcn 컴포넌트 대신 HTML, 이동 요소에 `LinkButton` 미사용, `div`/`span`의 `onClick`,
              상호작용 요소 중첩, 접근성(alt, aria-label, 키보드), 로딩, 에러, 빈 상태 처리

            절차
            1. `gh pr view --json additions,deletions,title,body`로 크기와 의도를 본다.
            2. `gh pr diff`로 변경을 보고, 판단에 필요하면 바뀐 파일 전체와 호출부를 읽는다.
            3. 80% 이상 확신하는 문제만 고른다. 타입, 린트, 포맷, 테스트는 CI가 보므로 다시 지적하지 않는다.

            남기는 것
            - 가장 중요한 문제 1개만 `mcp__github_inline_comment__create_inline_comment`(confirmed: true)로 그 줄에 남긴다.
              CRITICAL이나 HIGH가 없으면 인라인 코멘트를 남기지 않는다.
            - `gh pr comment`로 요약 코멘트 1개를 남긴다. 순서는 아래와 같다.
              1. 추가와 삭제를 더한 줄 수가 400을 넘으면 첫 줄에 "⚠️ 변경 N줄. 400줄 이하로 나누면 리뷰가 쉬워집니다"와
                 나눌 만한 단위(공통 코드, 서비스, 화면, 문서 등)를 한 줄로 적는다.
              2. 발견한 문제를 심각도 순서로 `### [심각도] 파일:줄` 형식으로 적는다. 없으면 "확신할 만한 문제 없음"이라고 쓴다.
              3. 사람 리뷰어가 도메인 관점에서 확인할 점을 1~3개 적는다.
            - 문장은 "-습니다"체로 쓴다. 리뷰는 GitHub 코멘트로만 남기고 일반 텍스트로 출력하지 않는다.
