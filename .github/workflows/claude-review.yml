name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          claude_args: |
            --model sonnet --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR의 변경사항을 리뷰해주세요.
            코드 품질, 버그 가능성, 보안 문제를 중심으로 검토하고,
            개선 사항이 있으면 인라인 코멘트로 남겨주세요.

            `gh pr diff`로 변경사항을 확인하세요.
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true)를 사용해 특정 코드 라인에 인라인 코멘트를 남기세요.
            `gh pr comment`으로 전체 리뷰 요약을 남기세요.
            리뷰 내용은 GitHub 코멘트로만 남기고, 일반 텍스트 메시지로 출력하지 마세요.
