name: Auto PR

# 작업 브랜치를 push하면 변경 내용을 분석해 draft PR을 자동 생성한다.
# 이미 열린 PR이 있으면 아무것도 하지 않으므로, 브랜치당 최초 push에서만 동작한다.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'perf/**'
      - 'docs/**'
      - 'test/**'

# 같은 브랜치에 연속으로 push해도 워크플로우가 겹쳐 돌지 않게 한다.
# 앞선 실행을 취소하지 않고 순서대로 돌려야 "이미 열린 PR 확인"이 제대로 걸린다.
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # origin/main...HEAD diff 계산을 위해 전체 히스토리가 필요하다.
          fetch-depth: 0

      - name: 열린 PR 및 변경 여부 확인
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          opened=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq 'length')
          changed=$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')

          echo "opened=$opened" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          if [ "$opened" != "0" ]; then
            echo "이미 열린 PR이 있어 생략한다."
          elif [ "$changed" = "0" ]; then
            echo "main 대비 변경 파일이 없어 생략한다."
          fi

      - name: Claude로 PR 생성
        if: steps.check.outputs.opened == '0' && steps.check.outputs.changed != '0'
        # 모델 호출이 실패해도 다음 스텝의 폴백으로 PR은 만들어져야 한다.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model sonnet --allowedTools "Read,Bash(git log:*),Bash(git diff:*),Bash(gh pr create:*),Bash(gh pr list:*)"
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ github.ref_name }}

            이 브랜치의 변경 내용을 분석해 draft PR을 생성하세요.

            1. `.claude/commands/pr-description.md`를 읽어 출력 형식을 확인하세요.
            2. `git log --oneline origin/main..HEAD`로 커밋 이력을 확인하세요.
            3. `git diff origin/main...HEAD`로 실제 변경 내용을 확인하세요.
            4. 아래 규칙으로 제목과 본문을 작성하세요.

            [제목]
            - `{type}({scope}): {한글 메시지}` 형식, 70자 이내
            - type: feat / fix / refactor / chore / perf / docs / test
            - scope: 변경 파일 경로에서 추론한다.
              `src/services/chat/**` 또는 `src/app/chat/**` -> chat
              sharing, board, library, auth, my-shop 도 같은 방식
              여러 도메인에 걸치거나 애매하면 scope를 생략한다.
              설정/워크플로우 변경은 config

            [본문]
            `## 작업 내용`, `## 변경 파일`, `## 테스트 계획` 세 섹션을 순서대로 포함한다.
            - 작업 내용: 무엇을 왜 바꿨는지. diff에서 보이는 사실만 쓰고 추측하지 않는다.
            - 변경 파일: `` `경로` — 설명 `` 형태의 목록
            - 테스트 계획: `- [ ]` 체크박스. 실제로 확인해야 할 항목만 쓴다.
            - 한글로 작성한다. 가운뎃점(·)은 쓰지 않는다.
            - 필요한 내용만 명료하게 쓴다. 불필요하게 길게 늘이지 않는다.

            5. 아래 명령으로 생성하세요.
               `gh pr create --base main --draft --title "제목" --body "본문"`

            반드시 `--draft`로 생성하세요.
            `gh pr merge`는 어떤 경우에도 실행하지 마세요.
            결과는 PR로만 남기고 별도 텍스트 출력은 하지 마세요.

      - name: 폴백 - 템플릿으로 PR 생성
        if: steps.check.outputs.opened == '0' && steps.check.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 앞 스텝이 PR을 만들었으면 여기서 끝낸다.
          url=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json url --jq '.[0].url // ""')
          if [ -n "$url" ]; then
            echo "PR 생성됨: $url"
            exit 0
          fi

          # 모델 호출이 실패한 경우: 커밋 로그와 변경 파일만으로 PR을 만든다.
          # 본문 품질보다 "PR이 무조건 생긴다"를 우선한다.
          echo "Claude 생성에 실패해 템플릿으로 대체한다."

          title=$(git log --format=%s -1)
          {
            echo "## 작업 내용"
            echo
            git log --format='- %s' origin/main..HEAD
            echo
            echo "## 변경 파일"
            echo
            git diff --name-only origin/main...HEAD | sed 's/^/- `/; s/$/`/'
            echo
            echo "## 테스트 계획"
            echo
            echo "- [ ] \`pnpm type-check\` / \`pnpm lint\` / \`pnpm test:run\` 통과"
            echo "- [ ] 변경된 화면 동작 확인"
            echo
            echo "> 본문 자동 생성에 실패해 커밋 이력으로 대체했습니다. 직접 보완해주세요."
          } > /tmp/pr-body.md

          gh pr create --base main --draft --title "$title" --body-file /tmp/pr-body.md