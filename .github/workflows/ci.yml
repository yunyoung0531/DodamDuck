# PR과 main push마다 타입, 린트, 테스트, 포맷, 문서와 코드의 어긋남을 검사한다. PR에서는 커밋 제목도 본다.
#
# git 훅(.husky/)은 --no-verify로 건너뛸 수 있어 오타 방지 장치일 뿐이다.
# 머지 전에 반드시 통과해야 하는 게이트는 이 워크플로다.
# 빌드는 Vercel이 PR마다 돌리므로 여기서 하지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새로 push하면 이전 실행은 결과가 의미 없으므로 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 커밋 훅은 CI에서 필요 없다
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint가 PR에 든 커밋 전체를 봐야 해서 히스토리를 모두 받는다
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm format:check
      - run: pnpm check:docs
      - name: 커밋 제목 검사
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "origin/${{ github.base_ref }}" --to "${{ github.event.pull_request.head.sha }}"
